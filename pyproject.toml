[project]
name = "EFIQA"
version = "1.0.0"
requires-python = ">=3.13,<3.14"
description = "EFIQA: Explainable Fundus Image Quality Assessment"
dependencies = [
    "torch==2.8.0",
    "torchvision",
    "transformers",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.6",
    "tensorboard",
    "tqdm==4.67.1",
    "opencv-python==4.12.0.88",
    "pyyaml==6.0.2",
    "hydra-core==1.3.2",
    "pandas",
    "timm==1.0.20",
    "fundus_image_toolbox==0.1.0",
    "statsmodels==0.14.5",
    "grad-cam",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
